# Publishes to the VS Code Marketplace (and Open VSX, if configured) whenever
# a push to main changes the package.json version to one with no `v<version>`
# tag yet. Start a release with the /release skill, which bumps the version and
# CHANGELOG.md. Running the workflow manually releases the current version if
# it is untagged.
#
# Secrets: VSCE_PAT (required, Azure DevOps PAT with Marketplace > Manage),
#          OVSX_PAT (optional, Open VSX access token).
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=true
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            release=false
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE:package.json" 2>/dev/null; then
            previous=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [ "$previous" = "$version" ]; then
              echo "Version unchanged ($version); nothing to release."
              release=false
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      VSIX: ken-markdown-editor-${{ needs.check.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[/ { if (f) exit }
            f
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          cat notes.md

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Package
        run: |
          npm run build -- --production
          npx vsce package --no-dependencies --skip-license --out "$VSIX"

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not set; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx publish "$VSIX" --pat "$OVSX_PAT" --skip-duplicate

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$VSIX" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md
